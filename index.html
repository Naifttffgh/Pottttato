<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Potato Vault 🍟</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

    <div id="step1" class="container">
        <div class="icon">🔐</div>
        <h1>بوابة البطاطس السرية</h1>
        <input type="password" id="passInput" placeholder="أدخل الباسورد التاريخي...">
        <button onclick="checkPassword()">تحقق من السخانة 🔥</button>
    </div>

    <div id="step2" class="container" style="display:none;">
        <h2 class="welcome-msg">welcome back 🙂</h2>
        <p>اكتب اسم حسابك بالانجليزي:</p>
        <input type="text" id="userInput" placeholder="Username...">
        <button onclick="enterVault()">دخول المخزن 🥔</button>
    </div>

    <div id="step3" class="container dashboard" style="display:none;">
        <h1 id="welcomeUser"></h1>
        <p class="path-text">رابط سري عشوائي: <span id="randomPath"></span></p>
        
        <button id="upload_widget" class="upload-btn">رفع فيديو جديد ⬆️</button>

        <div id="videoGrid" class="video-grid">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
