<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعتتي 🥔</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginPage" class="full-screen">
        <div class="login-box">
            <h2>بوابة جيش البطاطس 🛡️</h2>
            <p>أدخل الكود السري للدخول للمخزن 🙃</p>
            <input type="password" id="passwordInput" placeholder="الباسورد بالمسافات... 🔑">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <div id="mainContent" class="container" style="display: none;">
        <h1>مخزن الفيديوهات السري 📹</h1>
        <div id="videoGrid" class="video-grid"></div>
        <button class="fab" onclick="toggleAdmin()">+</button>

        <div id="adminPanel" class="admin-panel" style="display: none;">
            <h3>إضافة فيديو جديد 🥔</h3>
            <p style="font-size: 13px; color: #bbb; margin-bottom: 15px;">
                1. ارفع الفيديو هنا: 
                <a href="https://catbox.moe" target="_blank" style="color: #ff9800; font-weight: bold;">Catbox.moe</a>
            </p>
            <input type="text" id="videoUrlInput" placeholder="رابط ينتهي بـ .mp4 🙃">
            <button onclick="addPotatoVideo()">إضافة للمحرفة 🔥</button>
            <button onclick="toggleAdmin()" style="background: #444; margin-top: 10px;">إغلاق</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
