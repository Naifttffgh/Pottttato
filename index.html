<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعتتي 🥔 - مخزن البطاطس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="mainContent" class="container">
        <h1>مخزن الفيديوهات السري 📹</h1>
        <div id="videoGrid" class="video-grid"></div>
        
        <button class="fab" id="openAdminBtn">+</button>

        <div id="adminPanel" class="admin-panel" style="display: none;">
            <h3>إضافة فيديو جديد 🥔</h3>
            <p style="font-size: 13px; color: #bbb; margin-bottom: 15px;">
                ارفع الفيديو هنا: 
                <a href="https://catbox.moe" target="_blank" style="color: #ff9800; font-weight: bold;">Catbox.moe</a>
            </p>
            <input type="text" id="videoUrlInput" placeholder="رابط ينتهي بـ .mp4 🙃">
            <button id="addVideoBtn">إضافة للمحرقة 🔥</button>
            <button id="closeAdminBtn" style="background: #444; margin-top: 10px;">إغلاق</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
