<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعتتي 🥔</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginPage" class="full-screen">
        <div class="login-box">
            <h2>بوابة جيش البطاطس 🛡️</h2>
            <input type="password" id="passwordInput" placeholder="أدخل الباسورد السري... 🙃">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <div id="mainContent" class="container" style="display: none;">
        <h1>مخزن الفيديوهات السري 📹</h1>
        
        <div id="videoGrid" class="video-grid">
            </div>

        <button class="fab" onclick="toggleAdmin()">+</button>

        <div id="adminPanel" class="admin-panel" style="display: none;">
            <h3>إضافة فيديو جديد 🥔</h3>
            <input type="text" id="videoUrlInput" placeholder="حط رابط الـ .mp4 هنا...">
            <button onclick="addPotatoVideo()">إضافة للمحرفة 🔥</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
